<h2 mat-dialog-title>Label for "{{ data.bitza.name }}"</h2>

<mat-dialog-content>
  @if (qrDataUrl(); as qr) {
    <div class="label-preview">
      <img [src]="qr" alt="QR label for {{ data.bitza.name }}" width="220" height="220" />
    </div>
  } @else {
    <div class="loading-row">
      <mat-progress-spinner diameter="32" mode="indeterminate"></mat-progress-spinner>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="dialogRef.close()">Close</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!qrDataUrl()"
    (click)="onPrint()"
  >
    <mat-icon>print</mat-icon>
    Print
  </button>
</mat-dialog-actions>
